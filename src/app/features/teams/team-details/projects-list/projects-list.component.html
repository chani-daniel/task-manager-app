<div class="projects-container">
  <!-- Add Project Button -->
  <div class="add-project-section">
    <button mat-raised-button color="primary" (click)="openCreateProjectDialog()" class="add-btn">
      <mat-icon>add</mat-icon>
      הוסף פרויקט
    </button>
  </div>

  <!-- Projects Grid -->
  @if (projects.length > 0) {
    <div class="projects-grid">
      @for (project of projects; track project.id) {
        <mat-card class="project-card">
          <mat-card-header>
            <div class="card-header-content">
              <mat-icon class="project-icon">folder_open</mat-icon>
              <div class="project-info">
                <mat-card-title>{{ project.name }}</mat-card-title>
                <span class="project-status" [ngClass]="project.status || 'active'">
                  {{ getStatusText(project.status) }}
                </span>
              </div>
            </div>
          </mat-card-header>

          @if (project.description) {
            <mat-card-content class="description">
              {{ project.description }}
            </mat-card-content>
          }

          <mat-card-actions>
            <button mat-button color="primary" (click)="viewTasks(project)">
              <mat-icon>task_alt</mat-icon>
              משימות
            </button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  } @else {
    <div class="empty-state">
      <mat-icon>folder_off</mat-icon>
      <p>אין פרויקטים בצוות זה</p>
      <p class="hint">לחץ על "הוסף פרויקט" כדי ליצור פרויקט חדש</p>
    </div>
  }
</div>
